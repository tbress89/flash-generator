<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>FC Ik Dien - Flash</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <!-- This section will be completely hidden when you print -->
    <div class="no-print-area">
        <div>
            <label for="week-selector"><strong>Selecteer Flash: </strong></label>
            <select id="week-selector"></select>
            <button onclick="window.print()">🖨️ Afdrukken</button>
        </div>
    </div>
    
    <!-- This is the area that will be printed -->
    <div class="header-banner">
        <img src="images/grassroots.jpeg" alt="Grassroots">
        <img src="images/ikdien.jpeg" alt="Ik Dien">
        <img src="images/ikdien-oneteam.png" alt="Ik Dien - One Team">
        <img src="images/ikdien.jpeg" alt="Ik Dien">
        <img src="images/grassroots.jpeg" alt="Grassroots">
    </div>

    <div id="match-list" class="match-list">
        <p style="text-align: center;">Loading matches...</p>
    </div>

    <div class="footer-banner">
        <img src="images/sponsors.png" alt="Sponsors">
    </div>

    <script src="config.js"></script>
    <script>
        // Formats dates for the server request
        function formatDateForServer(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function getMostRecentMonday() {
            const today = new Date();
            const day = today.getDay();
            // Calculate days to subtract to get to Monday (0 is Sunday, so if 0 subtract 6, else subtract day - 1)
            const diff = today.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(today.setDate(diff));
        }

        // Fills the dropdown menu with weeks, each split into 4 entries:
        // Midweek Flash (Mon-Thu), Vrijdag Flash, Zaterdag Flash, Zondag Flash
        function generateWeeks() {
            const selector = document.getElementById('week-selector');
            let currentMonday = getMostRecentMonday();
            const shortOptions = { month: 'short', day: 'numeric' };

            for (let i = 0; i < 20; i++) {
                const monday = new Date(currentMonday);

                const thursday = new Date(monday);
                thursday.setDate(monday.getDate() + 3);

                const friday = new Date(monday);
                friday.setDate(monday.getDate() + 4);

                const saturday = new Date(monday);
                saturday.setDate(monday.getDate() + 5);

                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);

                const optgroup = document.createElement('optgroup');
                optgroup.label = `${monday.toLocaleDateString('nl-BE', shortOptions)} - ${sunday.toLocaleDateString('nl-BE', shortOptions)}`;

                const entries = [
                    { label: `Midweek Flash (${monday.toLocaleDateString('nl-BE', shortOptions)} - ${thursday.toLocaleDateString('nl-BE', shortOptions)})`, start: monday, end: thursday },
                    { label: `Vrijdag Flash (${friday.toLocaleDateString('nl-BE', shortOptions)})`, start: friday, end: friday },
                    { label: `Zaterdag Flash (${saturday.toLocaleDateString('nl-BE', shortOptions)})`, start: saturday, end: saturday },
                    { label: `Zondag Flash (${sunday.toLocaleDateString('nl-BE', shortOptions)})`, start: sunday, end: sunday },
                ];

                entries.forEach(entry => {
                    const optionElement = document.createElement('option');
                    optionElement.value = `${formatDateForServer(entry.start)}|${formatDateForServer(entry.end)}`;
                    optionElement.text = entry.label;
                    optgroup.appendChild(optionElement);
                });

                selector.appendChild(optgroup);

                currentMonday.setDate(currentMonday.getDate() + 7);
            }
        }

        // Maps RBFA pitch codes to our internal field names
        const pitchCodeToFieldName = {
            1: 'A-KGV',
            2: 'B-KGV',
            3: 'C',
        };
        
        let cachedTeamCalendars = null;
        
        // Fetches all team calendars directly from the RBFA API, filters them down to our
        // club's home games within the requested date range, removes duplicates, and only
        // then enriches the remaining (much smaller) list with their field name.
        async function fetchRbfaMatches(startDate, endDate) {
            const myStartDate = new Date(`${startDate}T00:00:00`);
            const myEndDate = new Date(`${endDate}T23:59:59`);

            // 1. Fetch only if we haven't already cached the team calendars
            if (!cachedTeamCalendars) {
                console.log("Fetching team calendars from RBFA API...");
                const fetchPromises = teamConfig.map(async (team) => {
                    const getTeamCalendarUrl = `https://datalake-prod2018.rbfa.be/graphql?operationName=GetTeamCalendar&variables={"teamId":"${team.teamId}","language":"nl","sortByDate":"asc"}&extensions={"persistedQuery":{"version":1,"sha256Hash":"3f0441e6723b9852b4f0cff2c872f4aa674c5de2d23589efc70c7a4ffb7f6383"}}`;

                    try {
                        const response = await fetch(getTeamCalendarUrl);
                        const data = await response.json();

                        if (data && data.data && data.data.teamCalendar) {
                            return data.data.teamCalendar.map(match => ({
                                ...match,
                                internalName: team.internalName,
                                cabineHome: team.cabineHome,
                                cabineAway: team.cabineAway
                            }));
                        }
                    } catch (err) {
                        console.error(`Failed to fetch team ${team.teamId}:`, err);
                    }
                    return [];
                });

                const results = await Promise.all(fetchPromises);
                cachedTeamCalendars = results.flat();
            }

            // 2. Filter from the cache instead of fetching again
            const filteredMatches = cachedTeamCalendars.filter(match => {
                if (!match.startTime) return false;

                const matchDate = new Date(match.startTime);
                const isWithinDates = (matchDate >= myStartDate && matchDate <= myEndDate);
                const isHomeGame = (match.homeTeam && match.homeTeam.clubId === "8175");

                return isWithinDates && isHomeGame;
            });

            // 3. Remove duplicate matches (same id), keeping only the first occurrence
            const seenMatchIds = new Set();
            const uniqueMatches = filteredMatches.filter(match => {
                if (seenMatchIds.has(match.id)) return false;
                seenMatchIds.add(match.id);
                return true;
            });

            // 4. Only NOW enrich the (already filtered) matches with their field name
            const enrichedMatches = await Promise.all(uniqueMatches.map(async match => {
                const getMatchDetailUrl = `https://datalake-prod2018.rbfa.be/graphql?operationName=GetMatchDetail&variables={"matchId":"${match.id}","language":"nl"}&extensions={"persistedQuery":{"version":1,"sha256Hash":"cd8867b845c206fe7aa75c1ebf7b53cbda0ff030253a45e2e2b4bcc13ee46c9a"}}`;

                try {
                    const matchResponse = await fetch(getMatchDetailUrl);
                    const matchData = await matchResponse.json();

                    const pitchCode = matchData.data.matchDetail ? matchData.data.matchDetail.location.pitchCode : null;

                    return {
                        ...match,
                        fieldName: pitchCodeToFieldName[pitchCode] || null
                    };
                } catch (err) {
                    console.error(`Failed to fetch match detail for match ${match.id}:`, err);
                    return { ...match, fieldName: null };
                }
            }));

            // 5. Sort the matches chronologically (earliest first)
            enrichedMatches.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

            return enrichedMatches;
        }

        // 6. Fetches and formats the matches based on the screenshot layout
        async function fetchMatches(startDate, endDate) {
            const listContainer = document.getElementById('match-list');
            listContainer.innerHTML = '<p style="text-align: center;">Loading matches...</p>';

            try {
                const newUrl = `?start=${startDate}&end=${endDate}`;
                window.history.pushState({ path: newUrl }, '', newUrl);

                const matches = await fetchRbfaMatches(startDate, endDate);

                listContainer.innerHTML = ''; 

                if (!matches || matches.length === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; margin-top: 50px;">Geen thuiswedstrijden gevonden.</p>';
                    return;
                }

                // 1. Group the matches by DATE first, then by FIELD
                const groupedMatches = {};

                matches.forEach(match => {
                    if (!match.startTime) return;

                    const matchDateObj = new Date(match.startTime);
                    const dateKey = match.startTime.split('T')[0]; 
                    
                    // Translate date to Dutch/Belgian format as seen in the screenshot (e.g., Zaterdag Flash (25/04/2026))
                    const dayName = matchDateObj.toLocaleDateString('nl-BE', { weekday: 'long' });
                    // Capitalize the first letter of the day
                    const dayNameCap = dayName.charAt(0).toUpperCase() + dayName.slice(1);
                    const dateFormatted = matchDateObj.toLocaleDateString('nl-BE', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const displayDate = `${dayNameCap} Flash (${dateFormatted})`;

                    const fieldName = match.fieldName ? match.fieldName : 'Onbekend terrein';

                    if (!groupedMatches[dateKey]) {
                        groupedMatches[dateKey] = {
                            displayDate: displayDate,
                            fields: {}
                        };
                    }

                    if (!groupedMatches[dateKey].fields[fieldName]) {
                        groupedMatches[dateKey].fields[fieldName] = [];
                    }

                    groupedMatches[dateKey].fields[fieldName].push(match);
                });

                // 2. Draw the layout perfectly matching the screenshot
                const sortedDateKeys = Object.keys(groupedMatches).sort();

                sortedDateKeys.forEach(dateKey => {
                    const dateGroup = groupedMatches[dateKey];

                    // Draw the large purple/grey header for the day
                    const dateTitle = document.createElement('div');
                    dateTitle.className = 'date-title-bar';
                    dateTitle.textContent = dateGroup.displayDate;
                    listContainer.appendChild(dateTitle);

                    // Create one big table for the whole day
                    const table = document.createElement('table');
                    table.className = 'flash-table';
                    const tbody = document.createElement('tbody');
                    table.appendChild(tbody);

                    const sortedFieldNames = Object.keys(dateGroup.fields).sort();

                    sortedFieldNames.forEach(fieldName => {
                        // Create the sub-header row for each field
                        const fieldHeaderRow = document.createElement('tr');
                        fieldHeaderRow.className = 'field-header-row';
                        fieldHeaderRow.innerHTML = `
                            <th>Terrein ${fieldName}</th>
                            <th>Thuisploeg</th>
                            <th>Bezoekers</th>
                            <th class="center-text">uur</th>
                            <th class="center-text">cabines<br>Ik Dien</th>
                            <th class="center-text">cabines<br>Bezoekers</th>
                        `;
                        tbody.appendChild(fieldHeaderRow);

                        // Loop through matches for this field
                        dateGroup.fields[fieldName].forEach(match => {
                            const tr = document.createElement('tr');
                            
                            // Determine names
                            const seriesName = match.series ? match.series.name : '';
                            const internalName = match.internalName ? match.internalName : (match.homeTeam ? match.homeTeam.name : 'Unknown');
                            const awayTeamName = match.awayTeam ? match.awayTeam.name : 'Unknown';
                            
                            // Extract just the time (e.g., 9:00 instead of 09:00 to match screenshot exactly)
                            const matchTimeObj = new Date(match.startTime);
                            const hours = matchTimeObj.getHours();
                            const minutes = String(matchTimeObj.getMinutes()).padStart(2, '0');
                            const timeText = `${hours}:${minutes}`;

                            // Locker rooms
                            const cabineHome = match.cabineHome || '-';
                            const cabineAway = match.cabineAway || '-';

                            // Combine the internal name and series if needed, or just map them to the columns
                            tr.innerHTML = `
                                <td>${seriesName}</td>
                                <td>${internalName}</td>
                                <td>${awayTeamName}</td>
                                <td class="center-text">${timeText}</td>
                                <td class="center-text">${cabineHome}</td>
                                <td class="center-text">${cabineAway}</td>
                            `;
                            
                            tbody.appendChild(tr);
                        });
                    });

                    // Add a Toogdienst row underneath the matches, split into a Senioren (player shifts)
                    // side and a Jeugd (team shifts) side. If one side is absent, the other takes the full width.
                    const [year, month, day] = dateKey.split('-');
                    const dateKeyFormatted = `${day}/${month}/${year}`;
                    const barServiceForDate = barServiceConfig.find(entry => entry.date === dateKeyFormatted);

                    if (barServiceForDate) {
                        const playerShifts = barServiceForDate.playerShifts || [];
                        const teamShifts = barServiceForDate.teamShifts || [];

                        if (playerShifts.length > 0 || teamShifts.length > 0) {
                            const barContainerRow = document.createElement('tr');
                            barContainerRow.className = 'bar-shift-container-row';

                            const barContainerCell = document.createElement('td');
                            barContainerCell.className = 'bar-shift-container-cell';
                            barContainerCell.colSpan = 6;

                            const splitDiv = document.createElement('div');
                            splitDiv.className = 'bar-shift-split';

                            if (playerShifts.length > 0) {
                                const seniorenColumn = document.createElement('div');
                                seniorenColumn.className = 'bar-shift-column';

                                const seniorenRows = playerShifts.map(shift => `
                                    <tr>
                                        <td>${shift.startTime} - ${shift.endTime}</td>
                                        <td>${shift.team || '-'}</td>
                                        <td>${shift.player || '-'}</td>
                                    </tr>
                                `).join('');

                                seniorenColumn.innerHTML = `
                                    <div class="bar-shift-column-header">Toogdienst Senioren</div>
                                    <table class="bar-shift-inner-table"><tbody>${seniorenRows}</tbody></table>
                                `;

                                splitDiv.appendChild(seniorenColumn);
                            }

                            if (teamShifts.length > 0) {
                                const jeugdColumn = document.createElement('div');
                                jeugdColumn.className = 'bar-shift-column';

                                const jeugdRows = teamShifts.map(shift => `
                                    <tr>
                                        <td>${shift.startTime} - ${shift.endTime}</td>
                                        <td>${shift.team || '-'}</td>
                                        <td>${shift.amountOfParents != null ? `${shift.amountOfParents} ouder(s)` : '-'}</td>
                                    </tr>
                                `).join('');

                                jeugdColumn.innerHTML = `
                                    <div class="bar-shift-column-header">Toogdienst Jeugd</div>
                                    <table class="bar-shift-inner-table"><tbody>${jeugdRows}</tbody></table>
                                `;

                                splitDiv.appendChild(jeugdColumn);
                            }

                            barContainerCell.appendChild(splitDiv);
                            barContainerRow.appendChild(barContainerCell);
                            tbody.appendChild(barContainerRow);
                        }
                    }

                    // Add a "Cabines kuisen" row underneath the Toogdienst row, listing which team
                    // cleans which cabine(s) at what time on this date.
                    const cabineCleaningForDate = cabineCleaningConfig.filter(entry => entry.date === dateKeyFormatted);

                    if (cabineCleaningForDate.length > 0) {
                        const cleaningContainerRow = document.createElement('tr');
                        cleaningContainerRow.className = 'bar-shift-container-row';

                        const cleaningContainerCell = document.createElement('td');
                        cleaningContainerCell.className = 'bar-shift-container-cell';
                        cleaningContainerCell.colSpan = 6;

                        const cleaningSplitDiv = document.createElement('div');
                        cleaningSplitDiv.className = 'bar-shift-split';

                        const cleaningColumn = document.createElement('div');
                        cleaningColumn.className = 'bar-shift-column';

                        const cleaningRows = cabineCleaningForDate.map(entry => `
                            <tr>
                                <td>${entry.time}</td>
                                <td>${entry.cabine || '-'}</td>
                                <td>${entry.team || '-'}</td>
                            </tr>
                        `).join('');

                        cleaningColumn.innerHTML = `
                            <div class="bar-shift-column-header">Cabines kuisen</div>
                            <table class="bar-shift-inner-table"><tbody>${cleaningRows}</tbody></table>
                        `;

                        cleaningSplitDiv.appendChild(cleaningColumn);
                        cleaningContainerCell.appendChild(cleaningSplitDiv);
                        cleaningContainerRow.appendChild(cleaningContainerCell);
                        tbody.appendChild(cleaningContainerRow);
                    }

                    listContainer.appendChild(table);
                });

            } catch (error) {
                console.error("Error fetching matches:", error);
                listContainer.innerHTML = '<p style="text-align: center; margin-top: 50px;">An error occurred while loading the matches.</p>';
            }
        }

        // Setup page controls
        generateWeeks(); 

        const selector = document.getElementById('week-selector');
        selector.addEventListener('change', (event) => {
            const [start, end] = event.target.value.split('|');
            fetchMatches(start, end);
        });

        // Finds the first option whose end date has not passed yet (i.e. the next upcoming Flash)
        function selectFirstUpcomingOption() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const options = Array.from(selector.options);
            const upcomingOption = options.find(option => {
                const [, end] = option.value.split('|');
                return new Date(`${end}T00:00:00`) >= today;
            });

            selector.value = (upcomingOption || options[0]).value;
        }

        const urlParams = new URLSearchParams(window.location.search);
        let initialStart = urlParams.get('start');
        let initialEnd = urlParams.get('end');

        if (initialStart && initialEnd) {
            selector.value = `${initialStart}|${initialEnd}`;
        } else {
            selectFirstUpcomingOption();
            [initialStart, initialEnd] = selector.value.split('|');
        }

        fetchMatches(initialStart, initialEnd);

    </script>
</body>
</html>
